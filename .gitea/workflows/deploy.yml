name: Deploy to local cluster with Helm
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGISTRY: host.minikube.internal:5000
      IMAGE_NAME: wtech-api
      NAMESPACE: default
      RELEASE_NAME: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          docker build -t "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" -f ./src/WTech.API/Dockerfile .
          docker tag "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" "${REGISTRY}/${IMAGE_NAME}:latest"
          docker push "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Deploy with Helm
        run: |
          helm upgrade --install "${RELEASE_NAME}" ./charts/development \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set api.image.repository="${REGISTRY}/${IMAGE_NAME}" \
            --set api.image.tag="${GITHUB_SHA}" \
            --set api.image.pullPolicy=Always

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${RELEASE_NAME}-api --timeout=180s
          kubectl get svc ${RELEASE_NAME}-api -o wide
          curl -fsS http://host.minikube.internal:30080/weatherforecast | head -c 200