name: Deploy to EKS with Helm
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/WTech.API/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wtech-api:${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to EKS with Helm
        run: |
          echo "Deploying to EKS cluster using Helm..."
          # Add Helm deployment steps here
          # Example:
          # helm upgrade --install wtech-api ./charts/development \
          #   --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/wtech-api \
          #   --set image.tag=${{ github.sha }} \
          #   --namespace development

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          # Add verification steps here