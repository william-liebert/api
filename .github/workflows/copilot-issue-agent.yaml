---
name: Assign New Issues to Copilot

"on":
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign-copilot:
    if: github.repository == 'william-liebert/api'
    runs-on: ubuntu-latest
    steps:
      - name: Assign Copilot to the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg branch "$DEFAULT_BRANCH" \
            '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repository,
                base_branch: $branch,
                custom_instructions: (
                  "Review the issue. If it calls for a code change, " +
                  "implement the smallest appropriate fix and open a pull " +
                  "request linked to the issue. If no code change is needed, " +
                  "explain in a concise issue comment. If information is " +
                  "missing, ask a clarifying question instead of guessing."
                ),
                custom_agent: "",
                model: "GPT-6 Luna"
              }
            }' |
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPOSITORY/issues/$ISSUE_NUMBER/assignees" \
              --input -
