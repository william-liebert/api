      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/terraform/cicd"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/terraform/infra"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/terraform/local"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/terraform/wtech-api"
    schedule:
      interval: "weekly"
