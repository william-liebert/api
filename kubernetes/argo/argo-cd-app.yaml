apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wtech-api-app
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: http://127.0.0.1:3000/developer/wtech-api.git
    targetRevision: HEAD
    path: .
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
